<!DOCTYPE html>
<html>
<head>
    <title>Prediction</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f4f4f4;
        }

        .box {
            margin-top: 100px;
        }

        input {
            padding: 10px;
            margin: 10px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            background: #2a5298;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Enter Transaction Details</h2>

    <form action="/predict" method="post">
        <input type="text" name="Amount" placeholder="Enter Amount" required><br>
        <button type="submit">Predict</button>
    </form>

    <h3>{{ prediction_text }}</h3>
    <p>{{ probability }}%</p>

    <br>
    <a href="/">Go Back</a>
</div>

</body>
</html>
